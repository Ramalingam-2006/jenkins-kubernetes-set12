
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-web
  template:
    metadata:
      labels:
        app: cicd-web
    spec:
      containers:
        - name: nginx
          image: ramalingam2006/jenkins-kubernetes-set12:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
